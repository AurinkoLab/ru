<style>
:root{
  --bg:#F4F2EA; --panel:#EBE7D9; --line:#D8D3C4; --line-soft:rgba(216,211,196,.6);
  --ink:#3A3831; --soft:#5C594E; --faint:#827D70; --ghost:#A39E8F;
  --a1:#2F7D6E; --a2:#2F5FA8; --a3:#A8414F; --a4:#71499B;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;line-height:1.6;

.hf{font-family:'Space Grotesk',sans-serif}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:999px;
  background:var(--panel);border:1px solid var(--line);font-size:10px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* ---------------- top banner + nav (matches the main site) ---------------- */
.banner{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 16px;text-align:center;
  font-size:13px;font-weight:500;color:var(--soft);letter-spacing:.01em}
.banner .in{max-width:80rem;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:center;
  align-items:center;gap:10px}
.banner .pill{padding:3px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);
  font-weight:700;font-size:10px;letter-spacing:.09em;text-transform:uppercase}
.banner .dot{color:var(--line)}

nav.top{position:sticky;top:0;z-index:50;background:rgba(244,242,234,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav.top .in{max-width:80rem;margin:0 auto;padding:0 24px;height:80px;display:flex;
  align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo .sq{width:44px;height:44px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:24px;flex:none}
.logo .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1.05}
.logo .nm span{font-weight:400}
.logo .sub{display:block;font-size:8px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);
  margin-top:-2px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600}
nav.top .links{display:flex;align-items:center;gap:22px;font-size:14px;font-weight:600;color:var(--soft)}
nav.top .links a{text-decoration:none}
nav.top .links a:hover{color:var(--ink)}
@media(max-width:680px){
  nav.top .in{height:auto;padding:12px 18px;flex-wrap:wrap}
  nav.top .links{gap:14px;font-size:13px}
  .logo .sub{display:none}
}

/* ---------------------------- course intro ---------------------------- */
.wrap{max-width:80rem;margin:0 auto;padding:0 24px}
.intro{padding:56px 0 8px}
.intro h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(34px,6vw,60px);
  line-height:1.04;letter-spacing:-.025em;margin:18px 0 18px;max-width:22ch}
.intro .lede{font-size:18px;color:var(--soft);max-width:60ch;margin:0 0 24px;line-height:1.7}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:36px;align-items:start;padding-bottom:20px}
@media(max-width:900px){.grid2{grid-template-columns:1fr;gap:26px}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:2rem;padding:28px 30px}
.box h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;margin:0 0 18px}
.box dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}
.box dt{color:var(--faint);font-weight:600}
.box dd{margin:0;font-weight:600}
h3.sect{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:28px 0 10px}
.intro ul{margin:0 0 6px;padding-left:20px;color:var(--soft)}
.intro li{margin-bottom:8px}

.alert{border:1px solid var(--line);border-left:4px solid #A8414F;background:#fff;
  border-radius:0 1rem 1rem 0;padding:16px 20px;margin:0 0 22px;font-size:14.5px;color:var(--soft);line-height:1.65}
.alert b{color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:center;width:100%;text-align:center;background:var(--bg);border:1px solid var(--line);
  color:var(--ink);font-weight:700;padding:15px 20px;border-radius:12px;text-decoration:none;
  cursor:pointer;margin-top:20px;transition:background .2s}
.cta:hover{background:var(--line)}
.cta.solid{background:var(--panel)}
.tiny{font-size:12px;color:var(--faint);margin:12px 0 0;line-height:1.5}
.pbar{height:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;overflow:hidden;margin:0 0 8px}
.pbar i{display:block;height:100%;background:var(--faint)}

/* ---------------------------- module list ---------------------------- */
.modules{border-top:1px solid var(--line);margin-top:20px;padding:44px 0 60px}
.modules>h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:36px;margin:14px 0 10px}
.modules>p{color:var(--soft);max-width:66ch;margin:0 0 30px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:start;
  background:var(--bg);border:1px solid var(--line);border-radius:2rem;padding:22px 26px;margin-bottom:14px;
  transition:border-color .2s,transform .2s,box-shadow .2s;text-align:left;width:100%;cursor:pointer}
.mrow:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:0 10px 24px rgba(58,56,49,.08)}
.mrow .n{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--faint);
  width:52px;height:52px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;flex:none}
.mrow h3{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:21px;margin:4px 0 6px}
.mrow p{margin:0 0 10px;font-size:14px;color:var(--soft);max-width:64ch}
.mrow .ls{display:flex;flex-wrap:wrap;gap:6px 14px;list-style:none;margin:0;padding:0;font-size:12.5px;color:var(--faint)}
.mrow .cnt{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  background:var(--panel);border:1px solid var(--line);padding:5px 11px;border-radius:999px;white-space:nowrap}
@media(max-width:620px){.mrow{grid-template-columns:auto 1fr;gap:16px;padding:18px}.mrow .cnt{display:none}}

/* ------------------------------- player ------------------------------- */
.player{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;
  max-width:80rem;margin:0 auto;padding:30px 24px 80px;align-items:start}
@media(max-width:980px){.player{grid-template-columns:1fr;gap:18px;padding:20px 18px 60px}}
.rail{background:var(--panel);border:1px solid var(--line);border-radius:2rem;padding:24px 0 16px;
  position:sticky;top:104px;max-height:calc(100vh - 124px);overflow-y:auto}
@media(max-width:980px){.rail{position:static;max-height:none}}
.rail::-webkit-scrollbar{width:6px}
.rail::-webkit-scrollbar-track{background:transparent}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
.rail .up{display:block;background:none;border:0;padding:0 26px;margin:0 0 14px;color:var(--faint);
  font-size:13px;font-weight:600;cursor:pointer;text-decoration:none}
.rail .up:hover{color:var(--ink)}
.rail h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;line-height:1.25;margin:0 26px 16px}
.rail .prog{margin:0 26px 18px}
.rail .prog .lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--faint)}
.rail .toggle{display:none}
@media(max-width:980px){.rail .toggle{display:block;margin:0 26px 14px;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;
  color:var(--ink);cursor:pointer;width:calc(100% - 52px)}}
.mod{border-top:1px solid var(--line-soft)}
.mod>button{width:100%;text-align:left;background:none;border:0;padding:13px 26px;cursor:pointer;
  display:flex;gap:12px;align-items:center;font-size:14px;font-weight:600;color:var(--soft)}
.mod>button:hover{color:var(--ink)}
.mod>button .cv{margin-left:auto;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--faint);
  background:var(--bg);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.mod.open>button{background:var(--bg);color:var(--ink);font-weight:700}
.mod ol{list-style:none;margin:0;padding:6px 0;background:var(--bg)}
.mod li button{width:100%;text-align:left;background:none;border:0;cursor:pointer;color:var(--soft);
  padding:9px 26px 9px 22px;display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start;
  border-left:4px solid transparent;font-size:13.5px;line-height:1.4}
.mod li button:hover{color:var(--ink)}
.mod li button[aria-current="true"]{border-left-color:var(--ink);color:var(--ink);font-weight:600}
.mod li .ic{color:var(--ghost);font-size:13px;text-align:center}
.mod li .ty{display:block;font-size:11px;font-weight:600;letter-spacing:.03em;color:var(--ghost);
  text-transform:uppercase;margin-top:2px}
.mod li .dn{color:var(--a1);font-size:12px;font-weight:700}

.stage{background:var(--bg);border:1px solid var(--line);border-radius:2rem;padding:38px 42px 40px;min-width:0}
@media(max-width:700px){.stage{padding:26px 22px 30px;border-radius:1.5rem}}
.stage .crumb{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
.stage h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(26px,4vw,36px);
  line-height:1.15;letter-spacing:-.02em;margin:0 0 8px}
.stage .ltype{font-size:13px;color:var(--faint);font-weight:600;margin:0 0 28px}
.stage h4{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:18px;margin:30px 0 10px}
.stage p{margin:0 0 15px;max-width:66ch;color:var(--soft);line-height:1.72}
.stage ul,.stage ol{margin:0 0 18px;padding-left:22px;max-width:66ch;color:var(--soft)}
.stage li{margin-bottom:9px;line-height:1.65}
.stage b,.stage strong{color:var(--ink)}

.qa{border-top:1px solid var(--line-soft);padding:15px 0;max-width:66ch}
.qa b{display:block;color:var(--ink);font-weight:700;margin-bottom:5px}
.qa p{margin:0}

.notice{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:16px 20px;
  margin:0 0 18px;font-size:14.5px;color:var(--soft);line-height:1.65;max-width:66ch}
.notice.warn{background:#fff;border-left:4px solid #A8414F;border-radius:0 1rem 1rem 0}
.notice.sun{background:var(--panel);border-left:4px solid var(--faint);border-radius:0 1rem 1rem 0}
.notice b{color:var(--ink)}
.notice p{margin:0 0 8px}.notice p:last-child{margin:0}

.linkcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:1rem;
  padding:16px 20px;margin:0 0 14px;text-decoration:none;max-width:66ch;transition:border-color .2s}
.linkcard:hover{border-color:var(--ink)}
.linkcard b{display:block;font-weight:700;margin-bottom:4px;color:var(--ink)}
.linkcard span{font-size:14px;color:var(--soft);line-height:1.55}
.linkcard .host{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ghost);margin-top:9px}

.vid{background:var(--panel);border:1px solid var(--line);border-radius:1.5rem;overflow:hidden;
  margin:0 0 18px;max-width:66ch}

/* click-to-play facade: nothing is requested from YouTube until this is pressed */
.vid .fr{display:block;width:100%;background:var(--bg);border:0;border-bottom:1px solid var(--line);
  padding:52px 24px;text-align:center;cursor:pointer;font:inherit;color:inherit;transition:background .2s}
.vid .fr:hover{background:var(--panel)}
.vid .fr .play{display:inline-flex;align-items:center;justify-content:center;width:68px;height:68px;
  border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  font-size:24px;padding-left:5px;transition:background .2s,transform .2s}
.vid .fr:hover .play{background:var(--line);transform:scale(1.04)}
.vid .fr .lb{display:block;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;
  color:var(--ink);margin-top:18px}
.vid .fr .hint{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ghost);margin-top:8px}

/* 16:9 player, responsive */
.vid .ratio{position:relative;width:100%;padding-top:56.25%;background:#000;
  border-bottom:1px solid var(--line)}
.vid .ratio iframe,.vid .ratio video{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

.vid .bd{padding:18px 20px 20px}
.vid b{display:block;font-weight:700;margin-bottom:5px}
.vid p{margin:0 0 14px;font-size:14px}
.vid .alt{display:inline-block;background:var(--bg);border:1px solid var(--line);color:var(--ink);
  font-weight:700;font-size:13px;padding:9px 16px;border-radius:12px;text-decoration:none}
.vid .alt:hover{background:var(--line)}
.vid .fallback{display:block;font-size:11.5px;color:var(--ghost);margin-top:10px;line-height:1.55}

.check{list-style:none;margin:0 0 6px;padding:0;max-width:66ch;
  background:var(--panel);border:1px solid var(--line);border-radius:1rem;overflow:hidden}
.check li+li{border-top:1px solid var(--line-soft)}
.check label{display:grid;grid-template-columns:22px 1fr;gap:14px;padding:14px 20px;cursor:pointer;align-items:start}
.check input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--ink);
  background:transparent!important;border:1px solid var(--line)!important}
.check .tx{font-size:14.5px;color:var(--ink);font-weight:600;line-height:1.5}
.check .sub{display:block;font-size:13px;font-weight:400;color:var(--faint);margin-top:4px;line-height:1.5}
.checksum{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);margin:10px 0 22px}

.tmpl{background:var(--panel);border:1px solid var(--line);border-radius:1.5rem;overflow:hidden;
  margin:0 0 20px;max-width:66ch}
.tmpl .hd{display:flex;align-items:center;gap:12px;padding:13px 20px;border-bottom:1px solid var(--line);
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.tmpl .hd button{margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  color:var(--ink);cursor:pointer}
.tmpl .hd button:hover{background:var(--line)}
.tmpl pre{margin:0;padding:20px;background:var(--bg);white-space:pre-wrap;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:13.5px;line-height:1.65;color:var(--ink)}

.ev{background:var(--panel);border:1px dashed var(--line);border-radius:1.5rem;padding:20px 22px;
  margin:26px 0 8px;max-width:66ch}
.ev p{font-size:13px;color:var(--faint);margin:0 0 12px;max-width:none}
.ev ul{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.ev li{font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px;background:var(--bg);
  border:1px solid var(--line);color:var(--ink);margin:0}
.ev li.a1{border-left:4px solid var(--a1)}.ev li.a2{border-left:4px solid var(--a2)}
.ev li.a3{border-left:4px solid var(--a3)}.ev li.a4{border-left:4px solid var(--a4)}

.navrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:38px;padding-top:26px;
  border-top:1px solid var(--line)}
.navrow .sp{flex:1}
.navrow button{background:var(--panel);border:1px solid var(--line);color:var(--ink);font-weight:700;
  font-size:14px;padding:12px 20px;border-radius:12px;cursor:pointer}
.navrow button:hover:not(:disabled){background:var(--line)}
.navrow button:disabled{opacity:.4;cursor:default}
.navrow .mark[data-done="1"]{background:var(--bg);color:var(--faint)}

/* ------------------------------- footer ------------------------------- */
footer.site{border-top:1px solid var(--line);background:var(--bg);padding:56px 0 40px;color:var(--faint)}
footer.site .cols{max-width:80rem;margin:0 auto;padding:0 24px;display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:40px;font-size:14px}
footer.site h4{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink);margin:0 0 14px}
footer.site ul{list-style:none;margin:0;padding:0}
footer.site li{margin-bottom:10px}
footer.site a{text-decoration:none}
footer.site a:hover{color:var(--ink)}
footer.site .brandline{display:flex;align-items:center;gap:12px;margin-bottom:14px}
footer.site .brandline .sq{width:40px;height:40px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:18px;color:var(--ink)}
footer.site .legal{max-width:80rem;margin:40px auto 0;padding:24px 24px 0;border-top:1px solid var(--line)}
footer.site .legal p{font-size:12px;line-height:1.65;color:var(--ghost);max-width:88ch;margin:0 0 10px}
</style>
</head>

  { n:1, title:"С чего начать", blurb:"Что представляет собой программа, что такое этот курс и та самая деталь, о которой вам обычно не говорят до самого конца.",
    lessons:[
    { id:"1.1", title:"Кому предназначен этот курс", type:"reading", dur:"5 min", blocks:[

      {p:"Это раннее положение не является дисквалификацией. Программа прямо разрешает участие тем, кто еще ничего не запустил, при условии жизнеспособности плана. Но это значит, что успех будет зависеть от трех факторов, и лишь один из них касается бумаг."},
      {ol:[

      {note:"Ничто здесь не заменяет официальные страницы программы. Правила меняются, и официальный текст всегда имеет приоритет. В каждом модуле есть ссылки на соответствующие официальные страницы, чтобы вы могли все перепроверить самостоятельно."}

    { id:"1.2", title:"Что делает и чего не делает AurinkoLab", type:"reading", dur:"4 min", blocks:[
      {p:"AurinkoLab ry — финская некоммерческая ассоциация, которая разрабатывает и проводит программы неформального обучения. Мы не являемся частью программы Erasmus для начинающих предпринимателей. Мы не выступаем местной контактной точкой, не участвуем в оценке или пересылке заявок и не связаны с Европейской комиссией."},
      {warn:"<b>Вы должны подать заявку самостоятельно.</b> Правила программы требуют, чтобы предприниматели лично подавали заявку через официальную платформу программы. Подача заявок через сторонних лиц не допускается. Нарушение этого правила может привести к исключению из программы и требованию вернуть полученные выплаты. Если какая-либо организация (включая нас) предлагает подать заявку за вас — откажитесь."},
      {p:"Подача заявки и участие в программе бесплатны. Правила программы запрещают любым организациям взимать плату за подачу заявки или участие. Если с вас требуют деньги за участие, значит, что-то идет не так."},
      {h:"Тогда что это за курс?"},
      {ul:[
        "Подготовка. Чтение, составление черновиков и расчет расходов, которые в противном случае вы делали бы в спешке.",

    { id:"1.3", title:"Программа в описании ее организаторов", type:"video", dur:"3 min", blocks:[

      {p:"Обратите внимание на одну деталь: как часто вместо слова «обучение» используется слово «сотрудничество». Это различие имеет решающее значение, поскольку обмен, похожий на обычную стажировку, не подходит под критерии программы."}

    { id:"1.4", title:"Честная арифметика", type:"reading", dur:"8 min", blocks:[
      {p:"Финансовая поддержка представляет собой частичное покрытие расходов на проезд и проживание во время пребывания за рубежом. Она рассчитывается ежемесячно на основе фиксированной суммы, установленной для страны пребывания, и выплачивается выбранной вами местной контактной точкой в рамках подписанного между вами соглашения."},

      {link:{href:"MONEY", title:"Ежемесячная финансовая поддержка по странам пребывания", desc:"Официальные суммы и единственное надежное место для их проверки. Цифры пересматриваются, поэтому любые данные из сторонних курсов или видео могут быть устаревшими."}},
      {note:"В этом курсе намеренно не приводятся конкретные суммы. Число, скопированное в учебные материалы, быстро устаревает, а цифра, которую вы запомнили наполовину, хуже ее отсутствия. Откройте официальную таблицу и запишите актуальную цифру для вашей страны вместе с датой проверки."},
      {h:"Если вы получаете пособие по безработице, сначала проконсультируйтесь"},
      {p:"Можете ли вы участвовать в программе во время получения пособия, что с ним станет за рубежом и доступен ли вам вместо этого грант на стартап — это вопросы к вашему местному органу занятости и ведомству по социальному обеспечению. В Финляндии это службы занятости (Työllisyyspalvelut) и Kela. Уточняйте конкретно поездку на срок от одного до шести месяцев за рубеж по линии обмена ЕС, а также возможность получения гранта на стартап (starttiraha) в рамках того же разговора."},

        "Хост, на чью площадку вы уже попали благодаря другой программе или стипендии.",

        "Любые прошлые или запланированные деловые или профессиональные отношения, которые делают обмен избыточным."

      {p:"Хосты должны предлагать подлинное предпринимательское сотрудничество и не имеют права использовать обмен как источник бесплатной рабочей силы или стажировку. Со своей стороны, обмен должен способствовать развитию ваших навыков управления бизнесом. Он не может быть профессиональным тренингом, стажировкой или продолжением работы на известном вам рабочем месте."},
      {p:"Существует еще одно правило, которое стоит знать тем, кто родился в другой стране: вам не запрещено проходить обмен в стране, с которой вас связывает прошлое (через учебу или поездки). Однако программу нельзя использовать не по назначению — например, исключительно для возвращения на родину или в место, где вы недавно провели много времени. Каждое дело оценивается индивидуально."},
      {warn:"Самый простой способ потратить свою единственную попытку — договориться об удобном размещении с кем-то, кого вы уже знаете, а затем обнаружить, что этот вариант неприемлем. Если у вас уже есть на примете кандидат в хосты, сверьте его с этим уроком, прежде чем вкладывать во что-то силы."},
      {link:{href:"ABOUT", title:"Правила программы в отношении соответствия критериям, целей и конфликта интересов", desc:"Официальное изложение всех вышеперечисленных ограничений, включая правила о конфликте интересов для сотрудников контактных точек."}}
    ]},

  { n:3, title:"Бизнес-план — это пропуск", blurb:"Заявки проходят жесткий отбор по качеству. Этот модуль посвящен созданию плана, способного пройти этот фильтр без истории продаж.",
    lessons:[
    { id:"3.1", title:"Почему заявки отклоняют", type:"reading", dur:"5 min", blocks:[
      {p:"Программа заявляет, что к участию могут быть допущены только надежные, хорошо проработанные заявки, отвечающие стандартам качества, и публикует соответствующие руководства. Воспринимайте это буквально: полностью заполненная заявка еще не означает автоматически одобренную заявку."},
      {p:"Для человека без истории продаж типичной ошибкой является не плохая идея сама по себе, а план, состоящий сплошь из благих намерений. Каждое предложение описывает то, что «будет сделано», но ничто не описывает то, что уже было сделано. У эксперта нет никакой возможности отличить такой документ от двадцати других планов на его столе, которые точно так же описывают лишь туманное будущее."},
      {h:"Что отличает один план от другого"},
      {ul:[

        "Описание того, что вы уже попробовали сделать, но что не сработало, и какие выводы вы сделали.",

      {link:{href:"APPLY", title:"Руководство по подаче заявок", desc:"Официальные рекомендации о том, что должна содержать заявка и каким стандартам она должна соответствовать."}}

    { id:"3.2", title:"Что содержит план, если вы еще ничего не продавали", type:"reading", dur:"8 min", blocks:[
      {p:"От вас не требуют презентации для инвесторов, а выдумывание пятилетних прогнозов выручки из ниоткуда только навредит вам. Ниже приведена структура, которая работает в условиях, когда честный ответ на большинство финансовых вопросов вам пока неизвестен."},
      {h:"Проблема словами кого-то другого"},

      {h:"Что вы собираетесь с этим делать"},
      {p:"Достаточно предметно, чтобы читатель мог представить себе первую сделку. Что покупается, кем, примерно за сколько и как доставляется."},

      {h:"Кто еще это делает и почему вы — не они"},
      {p:"Назовите реальных конкурентов. Заявление о том, что их нет, расценивается как нежелание искать. Если они существуют и имеют лучшее финансирование, объясните, что остается для вас."},
      {h:"Чего вы еще не умеете"},
      {p:"Пробел в компетенциях, сформулированный прямо. И затем обмен как средство его устранения. План, который признает свой пробел и предлагает конкретное лекарство, вызывает больше доверия, чем претендующий на абсолютную полноту, и он служит аргументом не просто для вашего бизнеса, а для вашей заявки."},
      {h:"Что произойдет в первые полгода после обмена"},
      {p:"Короткий, привязанный к датам и достаточно скромный план, чтобы в него поверили. Три шага с указанием месяцев."},
      {note:"Сначала напишите план на своем родном языке, если английский для вас не первый. Точный вариант на вашем языке с последующим переводом лучше, чем расплывчатый английский текст, составленный лишь потому, что так было проще."}
    ]},

    { id:"3.3", title:"Две недели клиентской проверки", type:"reading", dur:"7 min", blocks:[
      {p:"Это двухнедельный отрезок с максимальной отдачей, который не стоит ничего, кроме легкого дискомфорта. Цель — заменить благие намерения в вашем плане фактами о том, что уже произошло."},
      {h:"Дни 1–4: найдите проблему, не продавайте ничего"},
      {p:"Поговорите с десятью людьми, у которых гарантированно есть эта проблема. Не с друзьями, не с родственниками, не с теми, кто хочет поддержать вас. Спросите, как они справляются с ней сейчас и во что это обходится им в плане денег или времени. Не описывайте свою идею: вы не продаете, а описание изменит их ответы."},
      {p:"Запишите деталь, которая противоречит вашей задумке. Именно это предложение — главная цель всего упражнения, и именно его все обычно упускают."},
      {h:"Дни 5–8: оцените всё правильно"},
      {p:"Получите три реальных коммерческих предложения от реальных поставщиков всего необходимого для доставки одной единицы. Никаких поисковых выдач и воспоминаний по памяти. Нужен email с конкретной цифрой. Фиксируйте дату каждого предложения, так как цены меняются, а цифра без даты — не доказательство."},
      {h:"Дни 9–12: сделайте одно маленькое дело для одного человека"},
      {p:"Доставьте что-то действительно полезное одному человеку вне вашего круга бесплатно и попросите его написать одно предложение о том, была ли польза. Это намеренно маленький шаг. Он превращает вас из человека с планом в человека с опытом реализации, и эта фраза отправится в вашу заявку."},
      {h:"Дни 13–14: оформление"},
      {p:"Десять разговоров, три коммерческих предложения, одна доставка, один письменный отзыв. Вот вам план с фундаментом, и на него ушло две недели."},
      {ev:[["1.1","Выявление возможностей"],["1.4","Оценка ценности идей"],["2.4","Финансовая грамотность"],["4.1","Создание известности"],["3.1","Инициативность"]]}
    ]},

    { id:"3.4", title:"Расчет стоимости одной поставки", type:"template", dur:"6 min", blocks:[
      {p:"Скопируйте этот шаблон, заполните его реальными цифрами с указанием источников и сохраните в качестве приложения к плану. Даты здесь не для красоты: эксперт сразу отличит расчет, сделанный на прошлой неделе, от собранного по памяти."},
      {tmpl:{title:"Лист себестоимости единицы", text:

      {p:"Последние две строки — самые ценные. Указание показателя, в котором вы сомневаетесь больше всего, — это поступок грамотного основателя, и наличие такого анализа в плане (а не в ответ на каверзный вопрос) воспринимается как уверенность, а не неуверенность."},

    { id:"3.5", title:"Структура бизнес-плана", type:"template", dur:"6 min", blocks:[
      {p:"Каркас, соответствующий модулю 3.2, рассчитанный на человека без опыта продаж. Ориентируйтесь на 4–6 страниц. Больший объем не означает большую глубину — это воспринимается как «вода»."},
      {tmpl:{title:"Шаблон бизнес-плана", text:
"1. ПРОБЛЕМА\n   - Описание проблемы глазами человека, который с ней столкнулся (цитата или точный перефраз)\n   - Сколько людей потенциально ею страдают и откуда вам это известно\n   - Как они решают ее сейчас и во сколько это им обходится\n\n2. ЧТО Я БЫ СДЕЛАЛ(А) ДЛЯ ЕЕ РЕШЕНИЯ\n   - Конкретное предложение\n   - Описание первой сделки от начала до конца\n   - Что намеренно исключено из сферы охвата\n\n3. ДОКАЗАТЕЛЬСТВА К НАСТОЯЩЕМУ МОМЕНТУ\n   - Проведенные беседы: сколько, с кем (по ролям), что меня удивило\n   - Что я попытался(ась) сделать, но оно не сработало, и что я изменил(а)\n   - Все, что уже удалось поставить клиентам, и отзывы получателей\n\n4. ЦИФРЫ\n   - Себестоимость одной единицы (приложение: лист себестоимости)\n   - Цена и подтверждения того, что за нее готовы платить\n   - Что мне необходимо ежемесячно для поддержания работы\n   - Предположение, разрушающее эту модель, если оно окажется неверным\n\n5. РЫНОК И КОНКУРЕНТЫ\n   - Именные конкуренты или заменители\n   - Что реально остается для меня\n\n6. ЧЕГО Я ПОКА НЕ УМЕЮ\n   - Конкретный пробел в компетенциях\n   - Почему обмен решает эту задачу лучше, чем курс или найм сотрудника\n   - Какой тип принимающей компании обладает нужным опытом\n\n7. ПОСЛЕ ОБМЕНА\n   - Три шага с привязкой по месяцам\n   - Как в течение полугода я пойму, работает ли эта модель\n\nПРИЛОЖЕНИЯ\n   - Лист себестоимости единицы\n   - Письменный отзыв от клиента, получившего продукт\n   - Резюме (CV)"}},
      {note:"Раздел 6 — это то самое, что превращает обычный бизнес-план в заявку на участие. Большинство соискателей сдают план, который выглядел бы абсолютно одинаково независимо от того, существовала бы программа вообще или нет. Ваш план должен быть другим."}

  { n:4, title:"Поиск принимающего предпринимателя (хоста)", blurb:"Как работает подбор на практике, как сделать выбор и как написать ключевое сообщение.",

    { id:"4.3", title:"Первое сообщение принимающему предпринимателю", type:"template", dur:"7 min", blocks:[
      {p:"Хосты получают множество писем, где все крутится вокруг отправителя. Ваше письмо должно быть в основном о них, достаточно конкретным, чтобы доказать внимательное изучение их бизнеса, и оставлять им право легко отказаться. Возможность легко сказать «нет» — это не слабость, а то, что помогает вообще получить хоть какой-то ответ."},
      {tmpl:{title:"Первое обращение к принимающему предпринимателю", text:
"Тема: Обмен EYE — [ваша сфера], [месяцы, когда вы свободны]\n\nУважаемый(-ая) [Имя],\n\nЯ подаю заявку на участие в программе Erasmus для начинающих\nпредпринимателей в качестве нового предпринимателя и ищу хоста в сфере [сфера].\n\nПочему именно вы: [1–2 предложения, которые можно написать только\nпро этот бизнес. Что-то, что вы заметили в их работе, рынке,\nна который они вышли, или ограничениях, в условиях которых они действуют.]\n\nЧто я могу предложить: [конкретный навык, который можно проверить.\nНе «трудолюбие» и «мотивацию». Например: я пересобрал(-а) модель\nценообразования поставщиков, свободно говорю по-фински и по-русски,\nмогу вести ваши продажи на рынках Северной Европы.]\n\nЧему я хочу научиться: [пробел в компетенциях из вашего плана, названный прямо.]\n\nПрактические детали: [месяцы доступности], [от 1 до 6] месяцев,\nпрограмма частично покрывает мои расходы на проезд и проживание,\nпоэтому для вас не будет затрат на зарплату. Мой собственный план — [одна строка].\n\nЕсли это не ваш формат, отказ в одну строку будет мне чрезвычайно\nполезен, и я не стану писать во второй раз. Если тема стоит обсуждения,\nя на связи в любые дни с [диапазон дат].\n\n[Ваше имя]\n[Ссылка на что-то созданное вами, если есть]"}},
      {h:"Два правила отправки писем"},

    { id:"4.4", title:"Вопросы, которые нужно задать до подписания", type:"checklist", dur:"6 min", blocks:[

        {t:"Я подтвердил(-а), что это сотрудничество, а не стажировка или замена штатного сотрудника.", s:"Хосты не могут использовать обмен как источник бесплатного труда. Если описание похоже на обычную работу, скажите об этом вслух прямо сейчас."},
        {t:"Я убедился(-ась), что у нас нет прошлых или запланированных деловых или семейных связей.", s:"Проверьте по списку из модуля 2.3."},
        {t:"Я уточнил(-а), на каком языке реально ведется бизнес.", s:"Включая поставщиков, программное обеспечение и клиентов."},
        {t:"Я спросил(-а) насчет жилья и получил(-а) конкретный ответ или четкое «нет».", s:"Некоторые хосты помогают. Исходить из презумпции «они сами помогут», не спрашивая об этом, — верный способ остаться без крыши над головой."},
        {t:"Я пообщался(-ась) с предыдущим новым предпринимателем, которого они принимали, либо убедился(-ась), что таких не было.", s:"Большинство хостов, которым нравится процесс, принимают участников регулярно. Если прошлые участники были, попросите дать контакт одного из них."}
      ]}},
      {p:"Шесть или более галочек означают, что это партнерство стоит того, чтобы предложить его вашей контактной точке. Три или меньше — и вы собираетесь потратить свою единственную попытку ради простого удобства."}

  { n:5, title:"Документы и деньги", blurb:"Четыре этапа, документы, которые вы подписываете, и бюджет, который определяет, дойдете ли вы до конца.",

      {p:"Процесс выявления потребности, валидации, реализации и оценки обмена проходит в четыре этапа. Понимание этой структуры убережет вас от восприятия затянувшейся фазы подбора как отказа."},
      {ol:[

      {link:{href:"PRAC", title:"Обмен на практике", desc:"Официальные подробности о том, как подготавливается, проводится и завершается обмен."}}

      {p:"Соглашение о намерениях — это онлайн-документ, который оформляется после одобрения вашей пары. В нем прописываются цели и ожидания от обмена, план бизнеса, работы и обучения, задачи, обязанности и юридические аспекты. Его подписываете вы, хост и контактные точки."},

      {link:{href:"CONTR", title:"Договорные и финансовые аспекты", desc:"Официальные рекомендации по соглашению, договорам и тому, что подписывает каждая из сторон."}},

      {p:"Вы и ваша местная контактная точка подписываете соглашение, определяющее объем выделяемого финансирования на время пребывания и порядок его выплаты. Пособие рассчитывается ежемесячно на базе фиксированной суммы для страны пребывания и покрывает исключительно время, проведенное за рубежом в сотрудничестве с хостом."},

      {link:{href:"MONEY", title:"Финансовая поддержка и таблица ежемесячных пособий", desc:"Официальные суммы по странам пребывания. Проверяйте дату публикации таблицы, которую читаете."}},

    { id:"5.4", title:"Страховка, право на пребывание и жилье", type:"reading", dur:"6 min", blocks:[
      {p:"Это практические вопросы, которые не будет решать за вас никто другой, и именно они чаще всего превращают рабочий план в финансово неподъемный. Ни один из ответов ниже не является юридическим советом; каждый из них — это вопрос с указанием ведомства, способного на него ответить."},

      {p:"Уточните у контактной точки, какие виды страхования требует программа и что она не покрывает. Затем обратитесь в орган медицинского страхования своей страны, чтобы узнать правила для поездки вашей длительности в выбранную страну, и получите ответ в письменно виде. Ответственность при работе на чужом предприятии — отдельный вопрос; спросите хоста, что покрывает их корпоративная страховка."},

      {h:"Жилье"},
      {p:"Исходите из того, что искать жилье придется самостоятельно, и закладывайте это в бюджет. Спросите хоста, могут ли они что-то посоветовать (многие могут), но не стройте план только на этом. Избегайте выплаты крупных депозитов до того, как увидите жилье своими глазами или пообщаетесь с тем, кто там побывал."},
      {h:"Налоги"},
      {p:"Проконсультируйтесь в налоговой службе вашей страны насчет налогообложения пособия и влияния поездки на ваш налоговый статус резидента. Ответ зависит от страны и срока, поэтому здесь нужны официальные разъяснения, а не догадки."},

  { n:6, title:"Извлеките максимум пользы", blurb:"Сама поездка и то, как вернуться домой с чем-то более долговечным, чем просто хорошие воспоминания.",

    { id:"6.2", title:"Фиксация доказательств (evidence) по ходу дела", type:"reading", dur:"6 min", blocks:[

      {h:"Еженедельная заметка из четырех строк"},
      {ol:[
        "Что я сделал(а) такого, чего не смог(ла) бы месяц назад.",
        "В чем я ошибся(-лась) и что я изменил(а).",
        "Какое решение принял хост, которое я бы сделал(а) иначе, и почему они были правы или неправы.",

      {p:"Третий пункт — ключевой для накопления опыта. Фиксация вашего собственного мышления в сопоставлении с решениями опытного предпринимателя неделя за неделей — это ближайший аналог журнала развития профессионального суждения, и он куда убедительнее любой рекомендательной грамоты."},
      {p:"Сохраняйте артефакты по мере их появления с проставленными датами. Папка с датированными файлами в конце будет стоить дороже рекомендательного письма, поскольку демонстрирует реальную работу, а не просто утверждения о вашем качестве."},
      {note:"Это тот же принцип, на котором строится учет компетенций в AurinkoLab: фиксируйте то, что вы сделали, заметили и подтвердили фактами, а не то, что вы рассказываете о себе задним числом. Еженедельная заметка — это простейшая форма такого учета."},

    { id:"6.3", title:"Отчетность и финальная анкета", type:"reading", dur:"4 min", blocks:[
      {p:"Вы отчитываетесь о поездке, а ответственные контактные точки отслеживают ценность мероприятия и оценивают его результаты. По завершении обмена и вы, и хост заполняете обязательную онлайн-анкету обратной связи о вашем сотрудничестве."},

var KEY = "aurinkolab.eye.v1";
var store = { done:{}, checks:{} };
try{
  var raw = localStorage.getItem(KEY);
  if(raw){ var p = JSON.parse(raw); if(p && typeof p === "object"){ store.done = p.done || {}; store.checks = p.checks || {}; } }
}catch(e){ /* хранилище заблокировано: прогресс не сохранится, все остальное работает */ }

var playing = {};   /* ключи видео, на воспроизведение которых нажал пользователь, чтобы ререндер не останавливал их */

function doneCount(){ return LESSONS.filter(function(l){ return store.done[l.id]; }).length; }
function pct(){ return LESSONS.length ? Math.round(doneCount() / LESSONS.length * 100) : 0; }
function nextUndone(){
  for(var i = 0; i < LESSONS.length; i++){ if(!store.done[LESSONS[i].id]) return LESSONS[i]; }
  return LESSONS[LESSONS.length - 1];
}
function url(k){
  var map = {VIDEO:"video",CHAN:"chan",MONEY:"money",NEPROF:"neprof",ABOUT:"about",HOW:"how",LCP:"lcp",
    FAQ:"faq",APPLY:"apply",TOOL:"tool",PRAC:"prac",CONTR:"contr",HELP:"help",WHO:"who",NEACT:"neact",
    HEPROF:"heprof",STORIES:"stories",MATLS:"matls",HOME:"home"};

}
function host(u){ try{ return u.replace(/^https?:\/\//,"").split("/")[0]; }catch(e){ return ""; } }

/* ------------------------------------------------------------- blocks */

function blockHtml(b){
  if(b.h)  return "<h4>" + b.h + "</h4>";
  if(b.p)  return "<p>" + b.p + "</p>";
  if(b.ul) return "<ul>" + b.ul.map(function(i){ return "<li>" + i + "</li>"; }).join("") + "</ul>";
  if(b.ol) return "<ol>" + b.ol.map(function(i){ return "<li>" + i + "</li>"; }).join("") + "</ol>";
  if(b.note) return '<div class="notice">' + b.note + "</div>";
  if(b.warn) return '<div class="notice warn">' + b.warn + "</div>";
  if(b.sun)  return '<div class="notice sun">' + b.sun + "</div>";

  if(b.link){
    var u = url(b.link.href);
    return '<a class="linkcard" href="' + u + '" target="_blank" rel="noopener noreferrer"><b>' +
      b.link.title + "</b><span>" + b.link.desc + '</span><span class="host">' + host(u) + "</span></a>";
  }
  if(b.vid){
    var v = url(b.vid.href);
    var key = b.vid.yt || b.vid.file;
    var top;
    if(playing[key]){
      /* файл на своем сервере или YouTube в режиме повышенной конфиденциальности, запущенный пользователем */
      top = b.vid.file
        ? '<div class="ratio"><video controls autoplay playsinline preload="metadata" src="' + b.vid.file + '"></video></div>'
        : '<div class="ratio"><iframe src="https://www.youtube-nocookie.com/embed/' + b.vid.yt +
          '?autoplay=1&amp;rel=0&amp;modestbranding=1" title="' + b.vid.title +
          '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" ' +
          'referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>';
    }else{
      top = '<button class="fr" data-play="' + key + '" aria-label="Воспроизвести ' + b.vid.title + '">' +
        '<span class="play">\u25B6</span><span class="lb">Смотреть здесь</span>' +
        '<span class="hint">' + (b.vid.file ? "Размещено на этом сайте" : "YouTube загружается только при нажатии") +
        "</span></button>";
    }
    return '<div class="vid">' + top + '<div class="bd"><b>' + b.vid.title + "</b><p>" + b.vid.desc + "</p>" +
      '<a class="alt" href="' + v + '" target="_blank" rel="noopener noreferrer">Открыть на YouTube</a>' +
      (b.vid.file ? "" : '<span class="fallback">Если плеер не отображается, ваша сеть или браузер блокируют ' +
        "встроенный YouTube. Ссылка выше открывает то же видео.</span>") +
      "</div></div>";
  }
  if(b.check){
    var cid = b.check.id, st = store.checks[cid] || [];
    var rows = b.check.items.map(function(it, i){
      return '<li><label><input type="checkbox" data-check="' + cid + '" data-i="' + i + '"' +
        (st[i] ? " checked" : "") + '><span class="tx">' + it.t +
        (it.s ? '<span class="sub">' + it.s + "</span>" : "") + "</span></label></li>";
    }).join("");
    return '<ul class="check">' + rows + '</ul><p class="checksum" data-sum="' + cid + '">' +
      st.filter(Boolean).length + " из " + b.check.items.length + " отмечено</p>";
  }
  if(b.tmpl){
    return '<div class="tmpl"><div class="hd"><span>' + b.tmpl.title + '</span><button data-copy="1">Копировать</button></div><pre>' +
      b.tmpl.text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;") + "</pre></div>";
  }
  if(b.qa){
    return b.qa.map(function(r){ return '<div class="qa"><b>' + r[0] + "</b><p>" + r[1] + "</p></div>"; }).join("");
  }
  if(b.ev){
    var chips = b.ev.map(function(e){
      return '<li class="a' + String(e[0]).charAt(0) + '">' + e[0] + " " + e[1] + "</li>";
    }).join("");
    return '<div class="ev"><p>Правильное выполнение этого задания формирует подтверждения по данным направлениям компетенций. ' +
      "Направления под номером 4 являются расширением AurinkoLab и не входят в структуру EntreComp.</p><ul>" + chips + "</ul></div>";
  }
  return "";
}

      "об оказании платных услуг в сфере досуга.</p>" +
      "<p>Направления компетенций, упоминаемые в курсе, соответствуют EntreComp — Европейской рамочной структуре предпринимательских компетенций " +
      "(Bacigalupo, Kampylis, Punie and Van den Brande, JRC, 2016), которая является ориентиром, а не стандартом. Четвертая область является расширением " +
      "AurinkoLab и не входит в состав EntreComp. Никакие измерения здесь не служат гарантией коммерческого успеха бизнеса.</p>" +
      "<p>&copy; 2026 AurinkoLab Espoo.</p>" +
    "</div></footer>";
}

/* ---------------------------------------------------------------- views */

function introView(){
  var started = doneCount() > 0;
  var mods = COURSE.modules.map(function(m){
    return '<button class="mrow" data-open="' + m.lessons[0].id + '">' +
      '<span class="n">' + m.n + "</span><span><h3>" + m.title + "</h3><p>" + m.blurb + "</p>" +
      '<ul class="ls">' + m.lessons.map(function(l){
        return "<li>" + (store.done[l.id] ? "\u2713 " : "") + l.title + "</li>";
      }).join("") + '</ul></span><span class="cnt">' + m.lessons.length + " уроков</span></button>";
  }).join("");

  return chrome('<div class="wrap"><div class="intro"><div class="grid2"><div>' +
    '<span class="eyebrow">Онлайн \u00b7 бесплатно \u00b7 возраст 18+</span>' +
    "<h1>" + COURSE.title + "</h1>" +
    '<p class="lede">' + COURSE.lede + "</p>" +
    '<div class="alert"><b>Прочитайте это в первую очередь.</b> AurinkoLab не является частью программы и не выполняет ' +
      "функции местной контактной точки. Вы подаете заявку самостоятельно через официальную платформу. Заявки, поданные " +
      "третьими лицами, не допускаются и могут привести к исключению из программы и требованию возврата полученных выплат. " +
      "Участие в программе бесплатно, и ни одна организация не имеет права взимать с вас плату за это.</div>" +
    '<h3 class="sect">Этот курс для вас, если</h3><ul>' +
      COURSE.forWhom.map(function(i){ return "<li>" + i + "</li>"; }).join("") + "</ul>" +
    '<h3 class="sect">Вам не стоит проходить этот курс, если</h3><ul>' +
      COURSE.notFor.map(function(i){ return "<li>" + i + "</li>"; }).join("") + "</ul>" +
    "</div>" +
    '<aside class="box"><h3>Краткая справка</h3><dl>' +
      COURSE.facts.map(function(f){ return "<dt>" + f[0] + "</dt><dd>" + f[1] + "</dd>"; }).join("") +
      "<dt>Формат</dt><dd>Онлайн, в своем темпе</dd><dt>Язык</dt><dd>Английский</dd></dl>" +
      (started ? '<div style="margin-top:20px"><div class="pbar"><i style="width:' + pct() + '%"></i></div>' +
        '<p class="tiny" style="margin:0">' + pct() + "% пройдено, " + doneCount() + " из " + LESSONS.length + " уроков</p></div>" : "") +
      '<button class="cta solid" data-open="' + (started ? nextUndone().id : LESSONS[0].id) + '">' +
      (started ? "Продолжить с прерванного места" : "Начать модуль 1") + "</button>" +
      '<p class="tiny">Без аккаунта и регистрации. Прогресс сохраняется только в этом браузере, никакие данные никуда не отправляются.</p>' +
    "</aside></div></div>" +

    '<section class="modules"><span class="eyebrow">Семь модулей</span>' +
      "<h2 class=\"hf\">Чему посвящен курс</h2>" +
      "<p>Каждый модуль завершается созданием практического результата: расчета с источниками, отправленного сообщения " +
      "или честного чек-листа. Десять уроков также соотносят выполненную работу с потоками компетенций, благодаря чему ваши усилия " +
      "трансформируются в вещественные доказательства, а не в простую отметку о посещении.</p>" + mods +
    "</section></div>");
}

function lessonView(){
  var l = LESSONS.filter(function(x){ return x.id === route.lesson; })[0] || LESSONS[0];
  var idx = LESSONS.indexOf(l);
  openMod = l.mod.n;

  var rail = COURSE.modules.map(function(m){
    var md = m.lessons.filter(function(x){ return store.done[x.id]; }).length;
    var items = m.lessons.map(function(x){
      return '<li><button data-open="' + x.id + '"' + (x.id === l.id ? ' aria-current="true"' : "") + '>' +
        '<span class="ic">' + TYPE[x.type].ic + '</span><span>' + x.title +
        '<span class="ty">' + TYPE[x.type].label + (x.dur ? " \u00b7 " + x.dur : "") + "</span></span>" +
        '<span class="dn">' + (store.done[x.id] ? "\u2713" : "") + "</span></button></li>";
    }).join("");
    return '<div class="mod' + (m.n === openMod ? " open" : "") + '">' +
      '<button data-mod="' + m.n + '"><span>' + m.n + ". " + m.title + '</span>' +
      '<span class="cv">' + md + "/" + m.lessons.length + "</span></button>" +
      (m.n === openMod ? "<ol>" + items + "</ol>" : "") + "</div>";
  }).join("");

  var prev = idx > 0 ? LESSONS[idx - 1] : null;
  var next = idx < LESSONS.length - 1 ? LESSONS[idx + 1] : null;
  var isDone = !!store.done[l.id];

  return chrome('<div class="player"><aside class="rail">' +
      '<button class="up" data-go="intro">Вернуться на главную курса</button>' +
      "<h2>" + COURSE.title + "</h2>" +
      '<div class="prog"><div class="pbar"><i style="width:' + pct() + '%"></i></div>' +
        '<div class="lbl"><span>' + doneCount() + " из " + LESSONS.length + " пройдено</span><span>" + pct() + "%</span></div></div>" +
      '<button class="toggle" data-rail="1">' + (railOpen ? "Скрыть содержание" : "Показать все 7 модулей") + "</button>" +
      (railOpen ? "<div>" + rail + "</div>" : "") +
    "</aside>" +
    '<main class="stage">' +
      '<p class="crumb">Модуль ' + l.mod.n + " \u00b7 " + l.mod.title + "</p>" +
      "<h1>" + l.title + "</h1>" +
      '<p class="ltype">' + TYPE[l.type].label + (l.dur ? " \u00b7 " + l.dur : "") +
        " \u00b7 урок " + (idx + 1) + " из " + LESSONS.length + "</p>" +
      l.blocks.map(function(b){ return blockHtml(b); }).join("") +
      '<div class="navrow"><button class="mark" data-done="' + (isDone ? "1" : "0") + '" data-toggle="' + l.id + '">' +
        (isDone ? "Пройдено \u2713" : "Отметить как пройденное") + '</button><span class="sp"></span>' +
        '<button data-open="' + (prev ? prev.id : "") + '"' + (prev ? "" : " disabled") + ">Предыдущий</button>" +
        '<button data-open="' + (next ? next.id : "") + '"' + (next ? "" : " disabled") + ">Следующий урок</button>" +
      "</div></main></div>");
}

/* ---------------------------------------------------------------- wire */

function render(){
  document.getElementById("app").innerHTML = route.view === "intro" ? introView() : lessonView();
  wire();
}

function wire(){
  document.querySelectorAll("[data-go]").forEach(function(b){
    b.addEventListener("click", function(ev){
      ev.preventDefault();
      route.view = b.dataset.go; route.lesson = null;
      render(); window.scrollTo(0, 0);
    });
  });
  document.querySelectorAll("[data-open]").forEach(function(b){
    if(!b.dataset.open) return;
    b.addEventListener("click", function(){
      var fromIntro = route.view !== "lesson";
      route.view = "lesson"; route.lesson = b.dataset.open;
      render();
      if(fromIntro) window.scrollTo(0, 0);
      else { var s = document.querySelector(".stage"); if(s) s.scrollIntoView({ block:"start", behavior:"smooth" }); }
    });
  });
  document.querySelectorAll("[data-mod]").forEach(function(b){
    b.addEventListener("click", function(){
      var m = COURSE.modules.filter(function(x){ return x.n === Number(b.dataset.mod); })[0];
      if(m){ route.view = "lesson"; route.lesson = m.lessons[0].id; render(); }
    });
  });
  document.querySelectorAll("[data-play]").forEach(function(b){
    b.addEventListener("click", function(){ playing[b.dataset.play] = 1; render(); });
  });
  document.querySelectorAll("[data-rail]").forEach(function(b){
    b.addEventListener("click", function(){ railOpen = !railOpen; render(); });
  });
  document.querySelectorAll("[data-toggle]").forEach(function(b){
    b.addEventListener("click", function(){
      var id = b.dataset.toggle;
      if(store.done[id]) delete store.done[id]; else store.done[id] = 1;
      save(); render();
    });
  });
  document.querySelectorAll("[data-check]").forEach(function(cb){
    cb.addEventListener("change", function(){
      var cid = cb.dataset.check, arr = store.checks[cid] || [];
      arr[Number(cb.dataset.i)] = cb.checked;
      store.checks[cid] = arr; save();
      var sum = document.querySelector('[data-sum="' + cid + '"]');
      if(sum) sum.textContent = arr.filter(Boolean).length + " из " +
        document.querySelectorAll('[data-check="' + cid + '"]').length + " отмечено";
    });
  });
  document.querySelectorAll("[data-copy]").forEach(function(b){
    b.addEventListener("click", function(){
      var pre = b.closest(".tmpl").querySelector("pre");
      var done = function(){ b.textContent = "Скопировано"; setTimeout(function(){ b.textContent = "Копировать"; }, 1600); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(pre.textContent).then(done, function(){ b.textContent = "Выделите и скопируйте"; });
      }else{
        var r = document.createRange(); r.selectNodeContents(pre);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        b.textContent = "Нажмите Ctrl+C";
      }
    });
  });
}

render();

</script>
</body>
</html>
